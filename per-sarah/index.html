<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1424">
<title>✿</title>
<style>
  :root { --bg: #0d1424; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; cursor: pointer; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* ================== DA PERSONALIZZARE ================== */
const NOME      = "Sarah";
const MESSAGGIO = "non erano di stagione, così li ho scritti io";
const FIRMA     = "— Carlo";
const INVITO    = "> tocca per farli sbocciare_";
/* ======================================================= */

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W, H, DPR, CW, CH, COLS, ROWS, FONT;

// colori
const C = {
  stem: ['#3f7d4e', '#56a065', '#79c07f', '#9bd6a0'],
  leaf: '#5fae6c',
  pink: ['#ff8fb3', '#ffb3cb', '#ff6f9f'],
  yellow: ['#ffd76a', '#ffe9a3', '#f6c343'],
  purple: ['#a98bff', '#c7b3ff', '#8a6cf0'],
  blue: ['#6ea8ff', '#9cc4ff', '#4f86f0'],
  white: ['#f4f1ea', '#ffffff', '#dcd8cf'],
  red: ['#ff5a5f', '#ff7b7f', '#e8434a'],
  star: ['#ffffff', '#ffe9a3', '#c7b3ff', '#9cc4ff', '#ffb3cb'],
  text: '#ffb3cb'
};
const pick = (a, r) => a[Math.floor(r * a.length) % a.length];

// pseudo-random deterministico, così ogni volta sboccia lo stesso mazzo
let seed = 20261122;
const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  FONT = Math.max(9, Math.min(15, Math.floor(Math.min(W / 52, H / 72))));
  CW = FONT * 0.62; CH = FONT * 1.05;
  COLS = Math.floor(W / CW); ROWS = Math.floor(H / CH);
  build();
}

let stems, flowers, stars, ribbon, origin, startT = null, started = false, sparks = [];

function build() {
  seed = 20261122;
  const ox = COLS / 2, oy = ROWS * 0.66;
  origin = { x: ox, y: oy };
  const spread = Math.min(COLS * 0.42, ROWS * 0.5);
  const types = ['daisy', 'rose', 'lavender', 'tulip', 'breath', 'cluster'];
  stems = []; flowers = [];
  const N = 15;
  for (let i = 0; i < N; i++) {
    const f = i / (N - 1);                         // 0..1 da sinistra a destra
    const ang = (-58 + f * 116 + (rnd() - 0.5) * 6) * Math.PI / 180;
    const len = spread * (0.7 + rnd() * 0.35) * (1 - Math.abs(f - 0.5) * 0.3);
    const bend = (rnd() - 0.5) * 0.25;
    const hx = Math.max(-COLS * 0.4, Math.min(COLS * 0.4, Math.sin(ang) * len * 1.75));
    const end = { x: ox + hx, y: oy - Math.cos(ang) * len };
    const delay = 0.15 + rnd() * 0.9 + Math.abs(f - 0.5) * 0.6;
    stems.push({ ang, len, bend, end, delay, dur: 1.6 + rnd() * 0.8 });
    const type = types[Math.floor(rnd() * types.length)];
    const colorSet = { daisy: C.white, rose: rnd() < 0.5 ? C.pink : C.red, lavender: C.purple,
                       tulip: rnd() < 0.5 ? C.yellow : C.pink, breath: C.white, cluster: rnd() < 0.5 ? C.blue : C.purple }[type];
    flowers.push({ x: end.x, y: end.y, type, colors: colorSet, size: 1.8 + rnd() * 1.6,
                   at: delay + 1.5 + rnd() * 0.4, ang });
  }
  // fiori più piccoli in mezzo al mazzo
  for (let i = 0; i < 6; i++) {
    const s = stems[Math.floor(rnd() * stems.length)];
    const k = 0.55 + rnd() * 0.3;
    const x = origin.x + (s.end.x - origin.x) * k, y = origin.y + (s.end.y - origin.y) * k;
    flowers.push({ x, y, type: rnd() < 0.5 ? 'breath' : 'cluster', colors: rnd() < 0.5 ? C.yellow : C.blue,
                   size: 0.9 + rnd() * 0.6, at: s.delay + 1.4 + rnd() * 0.6, ang: s.ang });
  }
  // fiocco rosso a cuore
  ribbon = { x: ox, y: oy + 2.5, at: 3.4 };
  // stelle
  stars = [];
  for (let i = 0; i < Math.floor(COLS * ROWS / 55); i++) {
    stars.push({ x: rnd() * COLS, y: rnd() * ROWS * 0.95, ch: rnd() < 0.85 ? '.' : (rnd() < 0.5 ? '+' : '*'),
                 c: pick(C.star, rnd()), ph: rnd() * 6.28, sp: 0.6 + rnd() * 1.6 });
  }
}

function put(x, y, ch, color, alpha = 1, glow = 0) {
  if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return;
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.shadowColor = color; ctx.shadowBlur = glow;
  ctx.fillText(ch, Math.round(x) * CW, Math.round(y) * CH);
}

const ease = t => t < 0 ? 0 : t > 1 ? 1 : 1 - Math.pow(1 - t, 3);

function drawStem(s, t) {
  const p = ease((t - s.delay) / s.dur);
  if (p <= 0) return;
  const steps = Math.ceil(s.len * 1.6);
  for (let i = 0; i <= steps * p; i++) {
    const u = i / steps;
    const curve = Math.sin(u * Math.PI) * s.bend * s.len;
    const x = origin.x + (s.end.x - origin.x) * u + curve;
    const y = origin.y + (s.end.y - origin.y) * u;
    const dx = (s.end.x - origin.x) / s.len, slope = dx + Math.cos(u * Math.PI) * s.bend;
    const ch = Math.abs(slope) < 0.35 ? (u < 0.25 ? '|' : ':') : (slope > 0 ? '/' : '\\');
    put(x, y, ch, C.stem[Math.min(3, Math.floor(u * 4))], 0.9);
    // foglioline
    if (i % 9 === 4 && u > 0.2 && u < 0.85) put(x + (slope > 0 ? -1 : 1), y, slope > 0 ? '~' : '~', C.leaf, 0.8);
  }
}

function drawFlower(f, t) {
  const p = ease((t - f.at) / 1.2);
  if (p <= 0) return;
  const r = f.size * p, sway = Math.sin(t * 1.3 + f.x) * 0.25 * p;
  const fx = f.x + sway, fy = f.y;
  const g = 6;
  switch (f.type) {
    case 'daisy': {
      const n = 10;
      for (let k = 0; k < n; k++) {
        const a = k / n * 6.283 + t * 0.15;
        for (let d = 1; d <= r; d++) put(fx + Math.cos(a) * d * 1.6, fy + Math.sin(a) * d * 0.9, d > r - 1 ? '0' : 'o', f.colors[k % 3], 0.95, g);
      }
      put(fx, fy, '@', C.yellow[0], 1, 10); put(fx - 1, fy, 'o', C.yellow[2], 1, 8); put(fx + 1, fy, 'o', C.yellow[2], 1, 8);
      break;
    }
    case 'rose': {
      for (let a = 0; a < r * 7; a++) {
        const ang = a * 0.55, rr = 0.25 * a / 2.2;
        if (rr > r) break;
        put(fx + Math.cos(ang) * rr * 1.6, fy + Math.sin(ang) * rr * 0.9, a % 3 ? '@' : '%', f.colors[a % 3], 0.95, g);
      }
      break;
    }
    case 'lavender': {
      const h = Math.round(r * 2.2);
      for (let k = 0; k < h; k++) {
        const w = Math.max(0, Math.round((1 - k / h) * 1.5));
        for (let j = -w; j <= w; j++) put(fx + j + Math.sin(k * 0.8) * 0.4, fy - k, k % 2 ? 'o' : '0', f.colors[(k + j + 3) % 3], 0.95, g);
      }
      break;
    }
    case 'tulip': {
      const h = Math.round(r * 1.3) + 1;
      for (let k = 0; k < h; k++) {
        const w = Math.round((k / h) * r * 0.9) + 1;
        for (let j = -w; j <= w; j++) put(fx + j, fy - k, Math.abs(j) === w ? (j < 0 ? '(' : ')') : '#', f.colors[(k + 3) % 3], 0.95, g);
      }
      put(fx - Math.round(r * 0.9), fy - h, 'v', f.colors[0], 0.95, g); put(fx + Math.round(r * 0.9), fy - h, 'v', f.colors[0], 0.95, g);
      break;
    }
    case 'breath': {
      for (let k = 0; k < r * 5; k++) {
        const a = k * 2.399, d = Math.sqrt(k) * 0.9;
        put(fx + Math.cos(a) * d * 1.6, fy + Math.sin(a) * d * 0.9, k % 2 ? '·' : 'o', f.colors[k % 3], 0.9, g);
      }
      break;
    }
    case 'cluster': {
      for (let y = -Math.round(r); y <= Math.round(r); y++) {
        const w = Math.round(Math.sqrt(Math.max(0, r * r - y * y)) * 1.6);
        for (let x = -w; x <= w; x++) put(fx + x, fy + y, (x + y) % 2 ? 'o' : '0', f.colors[(x * 7 + y) & 1 ? 0 : 1], 0.9, g);
      }
      break;
    }
  }
}

function drawRibbon(t) {
  const p = ease((t - ribbon.at) / 0.9);
  if (p <= 0) return;
  // piccolo cuore come fiocco
  const heart = ['  ##   ##  ', ' ######### ', '###########', ' ######### ', '  #######  ', '    ###    ', '     #     '];
  const x0 = ribbon.x - 5, y0 = ribbon.y - 2;
  heart.forEach((row, j) => {
    [...row].forEach((ch, i) => {
      if (ch !== ' ' && (j / heart.length) < p * 1.2) put(x0 + i, y0 + j, (i + j) % 3 ? '#' : '=', C.red[(i + j) % 3], 1, 12);
    });
  });
  // gambi sotto il fiocco
  for (let k = 1; k < 3 * p; k++) for (let j = -1; j <= 1; j++) put(ribbon.x + j, ribbon.y + 5 + k, '|', C.stem[1], 0.75);
}

function drawText(t) {
  const lines = [
    { s: 'per te, ' + NOME + ' ✿', at: 5.2, size: 1.5, c: C.text },
    { s: MESSAGGIO, at: 6.6, size: 1.0, c: '#c9c3d9' },
    { s: FIRMA, at: 9.0, size: 1.0, c: '#8e88a3' }
  ];
  let y = H * 0.855;
  for (const L of lines) {
    const n = Math.floor(Math.max(0, (t - L.at) * 22));
    const txt = L.s.slice(0, n);
    ctx.font = `${Math.round(FONT * L.size)}px "SF Mono", ui-monospace, Menlo, Consolas, monospace`;
    ctx.globalAlpha = 1; ctx.fillStyle = L.c; ctx.shadowColor = L.c; ctx.shadowBlur = 8;
    const w = ctx.measureText(L.s).width;
    const cursor = n < L.s.length && n > 0 && (Math.floor(t * 3) % 2) ? '_' : '';
    ctx.fillText(txt + cursor, (W - w) / 2, y);
    y += FONT * L.size * 1.9;
  }
}

function drawStars(t, fade) {
  for (const s of stars) {
    const a = (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph))) * fade;
    put(s.x, s.y, s.ch, s.c, a, s.ch === '.' ? 0 : 6);
  }
}

function drawSparks(dt) {
  sparks = sparks.filter(p => (p.life -= dt) > 0);
  for (const p of sparks) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 6 * dt;
    put(p.x, p.y, p.ch, p.c, Math.min(1, p.life), 8);
  }
}

let last = 0;
function frame(now) {
  const t = now / 1000, dt = Math.min(0.05, t - last); last = t;
  ctx.clearRect(0, 0, W, H);
  ctx.textBaseline = 'top';
  ctx.font = `${FONT}px "SF Mono", ui-monospace, Menlo, Consolas, monospace`;
  if (!started) {
    drawStars(t, 0.5);
    ctx.shadowBlur = 0; ctx.globalAlpha = 1; ctx.fillStyle = '#c9c3d9';
    const s = INVITO.slice(0, -1) + ((Math.floor(t * 2) % 2) ? '_' : ' ');
    const w = ctx.measureText(s).width;
    ctx.fillText(s, (W - w) / 2, H * 0.48);
  } else {
    const e = t - startT;
    drawStars(t, Math.min(1, e / 2));
    // il punto da cui nasce tutto
    if (e < 1.2) put(origin.x, origin.y, '*', '#ffe9a3', Math.abs(Math.sin(e * 6)), 14);
    ctx.font = `${FONT}px "SF Mono", ui-monospace, Menlo, Consolas, monospace`;
    stems.forEach(s => drawStem(s, e));
    flowers.forEach(f => drawFlower(f, e));
    drawRibbon(e);
    drawSparks(dt);
    drawText(e);
    // ogni tanto una stellina cadente
    if (e > 6 && Math.random() < 0.006) {
      sparks.push({ x: Math.random() * COLS, y: 0, vx: 8, vy: 10, life: 2.5, ch: '*', c: '#ffffff' });
    }
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  requestAnimationFrame(frame);
}

function burst(px, py) {
  const x = px / CW, y = py / CH;
  for (let i = 0; i < 18; i++) {
    const a = Math.random() * 6.283, v = 4 + Math.random() * 10;
    sparks.push({ x, y, vx: Math.cos(a) * v * 1.6, vy: Math.sin(a) * v - 4, life: 1 + Math.random(),
                  ch: pick(['*', '+', 'o', '·', '♥'], Math.random()), c: pick(C.star.concat(C.pink, C.red), Math.random()) });
  }
}

addEventListener('pointerdown', e => {
  if (!started) { started = true; startT = performance.now() / 1000; return; }
  burst(e.clientX, e.clientY);
});
addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
