<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1424">
<title>Fiori per Sarah</title>
<style>
  :root { --bg: #0d1424; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { touch-action: none; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; cursor: pointer; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* ================== DA PERSONALIZZARE ================== */
// tutto in minuscolo, apposta
const MESSAGGIO = "non erano di stagione, così li ho scritti io";
const FIRMA     = "— carlo";
const INTRO     = "> prima, scaccia via i pensieri brutti_";
const SUGGERIMENTO = "toccali o trascinaci sopra il dito";
const FINE_GIOCO = "ecco. adesso c'è spazio per qualcosa di bello";
const PENSIERI = [
  "ansia", "overthinking", "e se poi...", "non sono abbastanza", "stanchezza",
  "paura di sbagliare", "giornata storta", "troppi pensieri", "dubbi", "tristezza",
  "non ce la faccio", "mille cose da fare"
];
const DA_SCACCIARE = 8;
/* ======================================================= */

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W, H, DPR, CW, CH, COLS, ROWS, FONT;

// colori
const C = {
  stem: ['#3f7d4e', '#56a065', '#79c07f', '#9bd6a0'],
  leaf: '#5fae6c',
  pink: ['#ff8fb3', '#ffb3cb', '#ff6f9f'],
  yellow: ['#ffd76a', '#ffe9a3', '#f6c343'],
  purple: ['#a98bff', '#c7b3ff', '#8a6cf0'],
  blue: ['#6ea8ff', '#9cc4ff', '#4f86f0'],
  white: ['#f4f1ea', '#ffffff', '#dcd8cf'],
  red: ['#ff5a5f', '#ff7b7f', '#e8434a'],
  azzurro: ['#7cc8ff', '#a8dcff', '#56b3f2'],
  star: ['#ffffff', '#ffe9a3', '#c7b3ff', '#9cc4ff', '#ffb3cb'],
  text: '#ffb3cb'
};
const pick = (a, r) => a[Math.floor(r * a.length) % a.length];

// pseudo-random deterministico, così ogni volta sboccia lo stesso mazzo
let seed = 20261122;
const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  FONT = Math.max(9, Math.min(15, Math.floor(Math.min(W / 52, H / 72))));
  CW = FONT * 0.62; CH = FONT * 1.05;
  COLS = Math.floor(W / CW); ROWS = Math.floor(H / CH);
  build();
}

let stems, flowers, stars, ribbon, origin, startT = null, sparks = [];

function build() {
  seed = 20261122;
  const ox = COLS / 2, oy = ROWS * 0.66;
  origin = { x: ox, y: oy };
  const spread = Math.min(COLS * 0.42, ROWS * 0.5);
  const types = ['daisy', 'rose', 'lavender', 'tulip', 'breath', 'cluster'];
  stems = []; flowers = [];
  const N = 15;
  for (let i = 0; i < N; i++) {
    const f = i / (N - 1);                         // 0..1 da sinistra a destra
    const ang = (-58 + f * 116 + (rnd() - 0.5) * 6) * Math.PI / 180;
    const len = spread * (0.7 + rnd() * 0.35) * (1 - Math.abs(f - 0.5) * 0.3);
    const bend = (rnd() - 0.5) * 0.25;
    const hx = Math.max(-COLS * 0.4, Math.min(COLS * 0.4, Math.sin(ang) * len * 1.75));
    const end = { x: ox + hx, y: oy - Math.cos(ang) * len };
    const delay = 0.15 + rnd() * 0.9 + Math.abs(f - 0.5) * 0.6;
    stems.push({ ang, len, bend, end, delay, dur: 1.6 + rnd() * 0.8 });
    const type = types[Math.floor(rnd() * types.length)];
    const colorSet = { daisy: C.white, rose: rnd() < 0.5 ? C.pink : C.red, lavender: C.purple,
                       tulip: rnd() < 0.5 ? C.yellow : C.pink, breath: C.white, cluster: rnd() < 0.5 ? C.blue : C.purple }[type];
    flowers.push({ x: end.x, y: end.y, type, colors: colorSet, size: 1.8 + rnd() * 1.6,
                   at: delay + 1.5 + rnd() * 0.4, ang });
  }
  // fiori più piccoli in mezzo al mazzo
  for (let i = 0; i < 6; i++) {
    const s = stems[Math.floor(rnd() * stems.length)];
    const k = 0.55 + rnd() * 0.3;
    const x = origin.x + (s.end.x - origin.x) * k, y = origin.y + (s.end.y - origin.y) * k;
    flowers.push({ x, y, type: rnd() < 0.5 ? 'breath' : 'cluster', colors: rnd() < 0.5 ? C.yellow : C.blue,
                   size: 0.9 + rnd() * 0.6, at: s.delay + 1.4 + rnd() * 0.6, ang: s.ang });
  }
  // fiocco rosso a cuore
  ribbon = { x: ox, y: oy + 2.5, at: 3.4 };
  // stelle
  stars = [];
  for (let i = 0; i < Math.floor(COLS * ROWS / 55); i++) {
    stars.push({ x: rnd() * COLS, y: rnd() * ROWS * 0.95, ch: rnd() < 0.85 ? '.' : (rnd() < 0.5 ? '+' : '*'),
                 c: pick(C.star, rnd()), ph: rnd() * 6.28, sp: 0.6 + rnd() * 1.6 });
  }
}

function put(x, y, ch, color, alpha = 1, glow = 0) {
  if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return;
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.shadowColor = color; ctx.shadowBlur = glow;
  ctx.fillText(ch, Math.round(x) * CW, Math.round(y) * CH);
}

const ease = t => t < 0 ? 0 : t > 1 ? 1 : 1 - Math.pow(1 - t, 3);

function drawStem(s, t) {
  const p = ease((t - s.delay) / s.dur);
  if (p <= 0) return;
  const steps = Math.ceil(s.len * 1.6);
  for (let i = 0; i <= steps * p; i++) {
    const u = i / steps;
    const curve = Math.sin(u * Math.PI) * s.bend * s.len;
    const x = origin.x + (s.end.x - origin.x) * u + curve;
    const y = origin.y + (s.end.y - origin.y) * u;
    const dx = (s.end.x - origin.x) / s.len, slope = dx + Math.cos(u * Math.PI) * s.bend;
    const ch = Math.abs(slope) < 0.35 ? (u < 0.25 ? '|' : ':') : (slope > 0 ? '/' : '\\');
    put(x, y, ch, C.stem[Math.min(3, Math.floor(u * 4))], 0.9);
    // foglioline
    if (i % 9 === 4 && u > 0.2 && u < 0.85) put(x + (slope > 0 ? -1 : 1), y, slope > 0 ? '~' : '~', C.leaf, 0.8);
  }
}

function drawFlower(f, t) {
  const p = ease((t - f.at) / 1.2);
  if (p <= 0) return;
  const r = f.size * p, sway = Math.sin(t * 1.3 + f.x) * 0.25 * p;
  const fx = f.x + sway, fy = f.y;
  const g = 6;
  switch (f.type) {
    case 'daisy': {
      const n = 10;
      for (let k = 0; k < n; k++) {
        const a = k / n * 6.283 + t * 0.15;
        for (let d = 1; d <= r; d++) put(fx + Math.cos(a) * d * 1.6, fy + Math.sin(a) * d * 0.9, d > r - 1 ? '0' : 'o', f.colors[k % 3], 0.95, g);
      }
      put(fx, fy, '@', C.yellow[0], 1, 10); put(fx - 1, fy, 'o', C.yellow[2], 1, 8); put(fx + 1, fy, 'o', C.yellow[2], 1, 8);
      break;
    }
    case 'rose': {
      for (let a = 0; a < r * 7; a++) {
        const ang = a * 0.55, rr = 0.25 * a / 2.2;
        if (rr > r) break;
        put(fx + Math.cos(ang) * rr * 1.6, fy + Math.sin(ang) * rr * 0.9, a % 3 ? '@' : '%', f.colors[a % 3], 0.95, g);
      }
      break;
    }
    case 'lavender': {
      const h = Math.round(r * 2.2);
      for (let k = 0; k < h; k++) {
        const w = Math.max(0, Math.round((1 - k / h) * 1.5));
        for (let j = -w; j <= w; j++) put(fx + j + Math.sin(k * 0.8) * 0.4, fy - k, k % 2 ? 'o' : '0', f.colors[(k + j + 3) % 3], 0.95, g);
      }
      break;
    }
    case 'tulip': {
      const h = Math.round(r * 1.3) + 1;
      for (let k = 0; k < h; k++) {
        const w = Math.round((k / h) * r * 0.9) + 1;
        for (let j = -w; j <= w; j++) put(fx + j, fy - k, Math.abs(j) === w ? (j < 0 ? '(' : ')') : '#', f.colors[(k + 3) % 3], 0.95, g);
      }
      put(fx - Math.round(r * 0.9), fy - h, 'v', f.colors[0], 0.95, g); put(fx + Math.round(r * 0.9), fy - h, 'v', f.colors[0], 0.95, g);
      break;
    }
    case 'breath': {
      for (let k = 0; k < r * 5; k++) {
        const a = k * 2.399, d = Math.sqrt(k) * 0.9;
        put(fx + Math.cos(a) * d * 1.6, fy + Math.sin(a) * d * 0.9, k % 2 ? '·' : 'o', f.colors[k % 3], 0.9, g);
      }
      break;
    }
    case 'cluster': {
      for (let y = -Math.round(r); y <= Math.round(r); y++) {
        const w = Math.round(Math.sqrt(Math.max(0, r * r - y * y)) * 1.6);
        for (let x = -w; x <= w; x++) put(fx + x, fy + y, (x + y) % 2 ? 'o' : '0', f.colors[(x * 7 + y) & 1 ? 0 : 1], 0.9, g);
      }
      break;
    }
  }
}

function drawRibbon(t) {
  const p = ease((t - ribbon.at) / 0.9);
  if (p <= 0) return;
  // piccolo cuore come fiocco
  const heart = ['  ##   ##  ', ' ######### ', '###########', ' ######### ', '  #######  ', '    ###    ', '     #     '];
  const x0 = ribbon.x - 5, y0 = ribbon.y - 2;
  heart.forEach((row, j) => {
    [...row].forEach((ch, i) => {
      if (ch !== ' ' && (j / heart.length) < p * 1.2) put(x0 + i, y0 + j, (i + j) % 3 ? '#' : '=', C.azzurro[(i + j) % 3], 1, 12);
    });
  });
  // gambi sotto il fiocco
  for (let k = 1; k < 3 * p; k++) for (let j = -1; j <= 1; j++) put(ribbon.x + j, ribbon.y + 5 + k, '|', C.stem[1], 0.75);
}

function drawText(t) {
  const lines = [
    { s: MESSAGGIO, at: 5.4, size: 1.05, c: '#c9c3d9' },
    { s: FIRMA, at: 7.8, size: 1.0, c: '#8e88a3' }
  ];
  let y = H * 0.87;
  for (const L of lines) {
    const n = Math.floor(Math.max(0, (t - L.at) * 22));
    const txt = L.s.slice(0, n);
    ctx.font = `${Math.round(FONT * L.size)}px "SF Mono", ui-monospace, Menlo, Consolas, monospace`;
    ctx.globalAlpha = 1; ctx.fillStyle = L.c; ctx.shadowColor = L.c; ctx.shadowBlur = 8;
    const w = ctx.measureText(L.s).width;
    const cursor = n < L.s.length && n > 0 && (Math.floor(t * 3) % 2) ? '_' : '';
    ctx.fillText(txt + cursor, (W - w) / 2, y);
    y += FONT * L.size * 1.9;
  }
}

function drawStars(t, fade) {
  for (const s of stars) {
    const a = (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph))) * fade;
    put(s.x, s.y, s.ch, s.c, a, s.ch === '.' ? 0 : 6);
  }
}

function drawSparks(dt) {
  sparks = sparks.filter(p => (p.life -= dt) > 0);
  for (const p of sparks) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 6 * dt;
    put(p.x, p.y, p.ch, p.c, Math.min(1, p.life), 8);
  }
}

// ---------- minigioco: i pensieri brutti ----------
let phase = 'intro';            // intro -> gioco -> pulito -> fiori
let thoughts = [], cleared = 0, spawned = 0, phaseT = 0, lastSpawn = 0, pointerDown = false;
const FONTF = () => `${FONT}px "SF Mono", ui-monospace, Menlo, Consolas, monospace`;
const THF = () => `${Math.round(FONT * 1.45)}px "SF Mono", ui-monospace, Menlo, Consolas, monospace`;

function spawnThought(t) {
  const text = PENSIERI[spawned % PENSIERI.length]; spawned++;
  ctx.font = THF();
  const w = ctx.measureText('( ' + text + ' )').width;
  const side = Math.random();
  const x = side < 0.5 ? 8 : Math.max(8, W - w - 8), y = H * (0.12 + Math.random() * 0.62);
  thoughts.push({ text, x, y, w, vx: (side < 0.5 ? 1 : -1) * (18 + Math.random() * 22),
                  vy: (Math.random() - 0.5) * 10, ph: Math.random() * 6.28, born: t, alive: true });
}

function drawThought(th, t, dt) {
  th.x += th.vx * dt; th.y += th.vy * dt + Math.sin(t * 1.2 + th.ph) * 8 * dt;
  // rimbalzano piano dentro lo schermo invece di andarsene
  if (th.x < 4 && th.vx < 0) th.vx *= -1;
  if (th.x + th.w > W - 4 && th.vx > 0 && t - th.born > 2) th.vx *= -1;
  if (th.y < H * 0.08 || th.y > H * 0.82) th.vy *= -1;
  ctx.font = THF();
  const fade = Math.min(1, (t - th.born) / 0.8);
  const pulse = 0.55 + 0.25 * Math.sin(t * 2 + th.ph);
  // nuvoletta grigia di caratteri attorno al pensiero
  ctx.shadowBlur = 0; ctx.globalAlpha = 0.3 * pulse * fade; ctx.fillStyle = '#6f7891';
  const cloud = '~'.repeat(Math.ceil(th.w / (CW * 1.45)));
  ctx.fillText(cloud, th.x, th.y - CH * 0.9); ctx.fillText(cloud, th.x, th.y + CH * 0.9);
  ctx.globalAlpha = 0.95 * fade; ctx.fillStyle = '#aeb4c6'; ctx.shadowColor = '#000'; ctx.shadowBlur = 6;
  ctx.fillText('( ' + th.text + ' )', th.x, th.y);
}

function hitThought(px, py) {
  for (const th of thoughts) {
    if (!th.alive) continue;
    if (px > th.x - 14 && px < th.x + th.w + 14 && py > th.y - CH * 1.4 && py < th.y + CH * 2.4) {
      th.alive = false; cleared++;
      // il pensiero si sbriciola in lettere che cadono, poi scintille colorate
      [...th.text].forEach((ch, k) => sparks.push({ x: (th.x + CW * (k + 2)) / CW, y: th.y / CH, vx: (Math.random() - 0.5) * 6,
        vy: -2 - Math.random() * 4, life: 1.2, ch, c: '#9aa1b5' }));
      burst(px, py);
      if (cleared >= DA_SCACCIARE) { phase = 'pulito'; phaseT = performance.now() / 1000; }
      return true;
    }
  }
  return false;
}

let last = 0;
function frame(now) {
  const t = now / 1000, dt = Math.min(0.05, t - last); last = t;
  ctx.clearRect(0, 0, W, H);
  ctx.textBaseline = 'top';
  ctx.font = FONTF();

  if (phase === 'intro') {
    drawStars(t, 0.35);
    ctx.shadowBlur = 0; ctx.globalAlpha = 1; ctx.fillStyle = '#c9c3d9';
    const s1 = INTRO.slice(0, -1) + ((Math.floor(t * 2) % 2) ? '_' : ' ');
    ctx.fillText(s1, (W - ctx.measureText(s1).width) / 2, H * 0.46);
    ctx.globalAlpha = 0.6; ctx.fillStyle = '#8e88a3';
    const s2 = '(tocca per iniziare)';
    ctx.fillText(s2, (W - ctx.measureText(s2).width) / 2, H * 0.46 + CH * 2);
  }

  else if (phase === 'gioco') {
    // il cielo è coperto: stelle quasi spente
    drawStars(t, 0.12 + 0.5 * cleared / DA_SCACCIARE);
    const onScreen = thoughts.filter(x => x.alive).length;
    if (onScreen < 4 && t - lastSpawn > 0.9 && cleared + onScreen < DA_SCACCIARE + 2) { spawnThought(t); lastSpawn = t; }
    thoughts.forEach(th => th.alive && drawThought(th, t, dt));
    drawSparks(dt);
    // contatore e suggerimento
    ctx.shadowBlur = 0; ctx.globalAlpha = 0.75; ctx.fillStyle = '#ffb3cb';
    const bar = '[' + '♥'.repeat(cleared) + '·'.repeat(DA_SCACCIARE - cleared) + ']';
    ctx.fillText(bar, (W - ctx.measureText(bar).width) / 2, H * 0.9);
    if (cleared < 2) {
      ctx.globalAlpha = 0.5; ctx.fillStyle = '#8e88a3';
      ctx.fillText(SUGGERIMENTO, (W - ctx.measureText(SUGGERIMENTO).width) / 2, H * 0.9 + CH * 1.8);
    }
  }

  else if (phase === 'pulito') {
    const e = t - phaseT;
    drawStars(t, Math.min(1, 0.6 + e * 0.3));
    drawSparks(dt);
    const n = Math.floor(e * 24), txt = FINE_GIOCO.slice(0, n);
    ctx.shadowBlur = 8; ctx.shadowColor = '#ffb3cb'; ctx.globalAlpha = Math.min(1, 3.2 - e * 0.8); ctx.fillStyle = '#ffb3cb';
    ctx.fillText(txt, (W - ctx.measureText(FINE_GIOCO).width) / 2, H * 0.46);
    if (e > 3.8) { phase = 'fiori'; startT = t; }
  }

  else {
    const e = t - startT;
    drawStars(t, 1);
    if (e < 1.2) put(origin.x, origin.y, '*', '#ffe9a3', Math.abs(Math.sin(e * 6)), 14);
    ctx.font = FONTF();
    stems.forEach(s => drawStem(s, e));
    flowers.forEach(f => drawFlower(f, e));
    drawRibbon(e);
    drawSparks(dt);
    drawText(e);
    if (e > 6 && Math.random() < 0.006) sparks.push({ x: Math.random() * COLS, y: 0, vx: 8, vy: 10, life: 2.5, ch: '*', c: '#ffffff' });
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  requestAnimationFrame(frame);
}

function burst(px, py) {
  const x = px / CW, y = py / CH;
  for (let i = 0; i < 18; i++) {
    const a = Math.random() * 6.283, v = 4 + Math.random() * 10;
    sparks.push({ x, y, vx: Math.cos(a) * v * 1.6, vy: Math.sin(a) * v - 4, life: 1 + Math.random(),
                  ch: pick(['*', '+', 'o', '·', '♥'], Math.random()), c: pick(C.star.concat(C.pink, C.azzurro), Math.random()) });
  }
}

addEventListener('pointerdown', e => {
  pointerDown = true;
  if (phase === 'intro') { phase = 'gioco'; lastSpawn = performance.now() / 1000 - 1; return; }
  if (phase === 'gioco') { if (!hitThought(e.clientX, e.clientY)) burst(e.clientX, e.clientY); return; }
  if (phase === 'fiori') burst(e.clientX, e.clientY);
});
addEventListener('pointermove', e => { if (pointerDown && phase === 'gioco') hitThought(e.clientX, e.clientY); });
addEventListener('pointerup', () => { pointerDown = false; });
addEventListener('pointercancel', () => { pointerDown = false; });
addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
